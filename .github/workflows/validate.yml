name: Validate PigeonFlyer JavaScript
on:
  push:
    branches: [main, fix/recorte-confianca-visual]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required files
        run: test -s index.html && test -s style.css && test -s app.js
